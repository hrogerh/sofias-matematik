<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Algebraiska uttryck – Sofias matematik</title>
  <link rel="stylesheet" href="../../css/style.css">
  <script>
    window.MathJax = {
      tex: { inlineMath: [['\\(','\\)']], displayMath: [['\\[','\\]']] },
      options: { skipHtmlTags: ['script','noscript','style','textarea'] }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
</head>
<body>

  <header class="lesson-header">
    <button class="btn-back" id="backBtn">←</button>
    <div class="lesson-title">Algebraiska uttryck</div>
    <div class="step-dots" id="dots"></div>
  </header>

  <main class="lesson-content" id="content"></main>

  <script src="../../js/auth.js"></script>
  <script src="../../js/lesson.js"></script>
  <script>
    requireAuth();

    const steps = [
      {
        type: 'theory',
        text: 'Ett algebraiskt uttryck innehåller en eller flera bokstäver som kallas <strong>variabler</strong>. Variabeln kan byta värde.',
        example: '\\( 3x + 5 \\)\n\nOm \\( x = 2 \\) &nbsp;→&nbsp; \\( 3 \\cdot 2 + 5 = 11 \\)\nOm \\( x = 4 \\) &nbsp;→&nbsp; \\( 3 \\cdot 4 + 5 = 17 \\)'
      },
      {
        type: 'exercise',
        q: 'Vad blir \\( 3x + 5 \\) när \\( x = 6 \\)?',
        answer: '23',
        ok:    'Rätt! \\( 3 \\cdot 6 = 18 \\), och \\( 18 + 5 = 23 \\).',
        retry: 'Prova igen. Börja med att räkna \\( 3 \\cdot 6 \\).',
        hint:  'Räkna \\( 3 \\cdot 6 \\) först, lägg sedan till 5.'
      },
      {
        type: 'theory',
        text: 'Ett uttryck kan ha flera termer. Termer med samma variabel kallas <strong>likatermer</strong> och kan slås ihop.',
        example: '\\( 2x + 4x = 6x \\)\n\n\\( 5x + 3 + 2x = 7x + 3 \\)'
      },
      {
        type: 'exercise',
        q: 'Förenkla: \\( 3x + 5x \\)',
        answer: '8x',
        ok:    'Precis! \\( 3x + 5x = 8x \\).',
        retry: 'Lägg ihop koefficienterna framför x.',
        hint:  '\\( 3 + 5 = 8 \\), så svaret är \\( 8x \\).'
      },
      {
        type: 'exercise',
        q: 'Vad är värdet av \\( 2x + 3 \\) när \\( x = 5 \\)?',
        answer: '13',
        ok:    'Rätt! \\( 2 \\cdot 5 + 3 = 10 + 3 = 13 \\).',
        retry: 'Sätt in \\( x = 5 \\) i uttrycket.',
        hint:  'Räkna \\( 2 \\cdot 5 \\) och lägg sedan till 3.'
      },
      {
        type: 'exercise',
        q: 'Förenkla: \\( 4x + 2 + 3x + 6 \\)',
        answer: '7x+8',
        altAnswers: ['7x + 8'],
        ok:    'Perfekt! \\( 4x + 3x = 7x \\) och \\( 2 + 6 = 8 \\).',
        retry: 'Samla x-termerna för sig och talen för sig.',
        hint:  'Likatermer: \\( 4x + 3x \\) och \\( 2 + 6 \\).'
      }
    ];

    initLesson(steps, {
      backUrl: 'index.html',
      doneUrl: '02-ekvationer.html',
      doneText: 'Fortsätt till ekvationer →'
    });
  </script>
</body>
</html>
